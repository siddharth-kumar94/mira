[project]
name = "rally-poc-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143",
  "httpx>=0.28",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "uvicorn>=0.54",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
